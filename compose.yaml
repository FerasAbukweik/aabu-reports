services:
  aabu_reports:
    container_name: AabuReports.Webapi
    build:
      context: .
      dockerfile: src/AabuReports.Webapi/Dockerfile
      args:
        BUILD_CONFIGURATION: ${ASPNETCORE_ENVIRONMENT}
    ports:
      - 8080:8080
      - 8081:8081
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__Default=server=mssql-service;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Database=AABU_REPORTS
      - Jwt__Key=${JWT_KEY}
      - Serilog__WriteTo__2__Args__serverUrl=http://seq:80
      - SeedAdmin__StudentId=${ADMIN_STUDENT_ID}
      - SeedAdmin__Password=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - SeedAdmin__Email=${ADMIN_EMAIL}
      - SeedAdmin__FullName=${ADMIN_FULL_NAME}
      - CloudinarySettings__CloudName=${CloudName}
      - CloudinarySettings__ApiKey=${ApiKey}
      - CloudinarySettings__ApiSecret=${ApiSecret}
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      mssql-service:
        condition: service_healthy
      seq:
        condition: service_started
      redis:
        condition: service_healthy
        
        
  mssql-service:
    container_name: AabuReports.mssql-server
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=Evaluation
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SQL_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      
      
  seq:
    container_name: AabuReports.seq
    image: datalust/seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_PASSWORD=${SEQ_PASSWORD}
    volumes:
      - seq_data:/data
    ports:
      - 5341:80

  redis:
    image: redis:7-alpine
    container_name: AabuReports.redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      
  angular:
    container_name: AabuReports.angular
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - aabu_reports

volumes:
  mssql_data:
  seq_data:
  redis_data:
