<app-dialog
  [open]="!!row()"
  title="حذف البلاغ"
  [subtitle]="row()?.shortId"
  icon="delete"
  maxWidth="max-w-md"
  (closed)="closed.emit()"
>
  @if (row(); as r) {
    <div class="flex flex-col gap-4">
      <p class="text-sm font-medium text-text-secondary">
        هل أنت متأكد من حذف البلاغ
        <span class="font-mono font-bold text-primary" dir="ltr">{{ r.shortId }}</span>؟ لا يمكن التراجع عن هذا الإجراء.
      </p>

      <div class="flex w-full items-center gap-3 border-t border-border-subtle pt-4">
        <button
          type="button"
          class="btn btn-accent flex-1 py-2.5 text-sm"
          [disabled]="submitting()"
          (click)="confirm()"
        >
          {{ submitting() ? 'جارٍ الحذف...' : 'نعم، احذف البلاغ' }}
        </button>
        <button type="button" class="btn btn-subtle flex-1 py-2.5 text-sm" (click)="closed.emit()">
          إلغاء
        </button>
      </div>
    </div>
  }
</app-dialog>
