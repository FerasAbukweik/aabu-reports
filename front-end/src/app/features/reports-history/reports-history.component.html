<div class="flex flex-col gap-6">
  <!-- Title -->
  <div class="flex flex-col justify-between gap-4 md:flex-row md:items-end">
    <div>
      <nav
        aria-label="مسار التنقل"
        class="mb-2 flex items-center gap-2 text-xs font-bold text-text-secondary"
      >
        <span>جامعة آل البيت</span>
        <span
          class="material-symbols-outlined text-[14px] text-text-muted rtl:rotate-180"
          aria-hidden="true"
          >chevron_right</span
        >
        <span>البوابة الطلابية</span>
        <span
          class="material-symbols-outlined text-[14px] text-text-muted rtl:rotate-180"
          aria-hidden="true"
          >chevron_right</span
        >
        <span class="rounded bg-primary/10 px-2 py-0.5 text-[11px] font-bold text-primary"
          >سجل البلاغات ومتابعة الحالات</span
        >
      </nav>
      <h1 class="flex items-center gap-2.5 text-2xl font-black text-primary lg:text-3xl">
        <span class="material-symbols-outlined text-[32px] text-accent" aria-hidden="true"
          >assignment</span
        >
        <span>سجل البلاغات المودعة</span>
      </h1>
      <p class="mt-1 max-w-2xl text-sm font-medium text-text-secondary">
        متابعة لحظية وموثوقة لجميع بلاغاتك الإنشائية والتقنية والخدمية داخل الحرم الجامعي
      </p>
    </div>

    <a routerLink="/report" class="btn btn-primary self-start md:self-auto">
      <span class="material-symbols-outlined text-[20px] text-accent" aria-hidden="true"
        >add_circle</span
      >
      <span>تقديم بلاغ جديد</span>
    </a>
  </div>

  <!-- Stats -->
  <app-stat-cards [cards]="statCards()" ariaLabel="إحصائيات البلاغات والصيانة" />

  <!-- Search + filters -->
  <app-search-filter-bar
    [(query)]="query"
    [(values)]="filterValues"
    [filters]="filters"
    [resultsLabel]="resultsLabel()"
    [showApply]="true"
    [applyDisabled]="!hasUnappliedChanges() || isLoading()"
    (applied)="applyFilters()"
    (filtersReset)="onFiltersReset()"
    searchLabel="البحث في البلاغات"
    placeholder="بحث في كل بلاغاتك: رقم البلاغ (#3F2A9C1E) أو المكان أو وصف العطل..."
  />

  <!-- Table -->
  <app-reports-table
    [rows]="rows()"
    [page]="page()"
    [totalPages]="totalPages()"
    [isLoading]="isLoading()"
    [hasFailed]="hasLoadFailed()"
    [footerLabel]="footerLabel()"
    [emptyMessage]="emptyMessage()"
    (pageChange)="goToPage($event)"
    (retryRequested)="retry()"
    (rateRequested)="openRating($event)"
    [isAdmin]="isAdmin"
    (stateChangeRequested)="openStateChange($event)"
    (deleteRequested)="openDelete($event)"
  />
</div>

<app-report-rating-modal [row]="liveRatingRow()" (closed)="ratingRow.set(null)" />

@if (isAdmin) {
  <app-report-state-modal [row]="liveStateRow()" (closed)="stateRow.set(null)" />
  <app-report-delete-modal [row]="deleteRow()" (closed)="deleteRow.set(null)" (deleted)="onReportDeleted()" />
}
