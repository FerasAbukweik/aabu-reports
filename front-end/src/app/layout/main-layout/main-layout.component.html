<div dir="rtl" lang="ar" class="min-h-screen overflow-x-clip bg-surface-bg text-text-primary">
  <app-header />

  <!-- Side navigation -->
  <app-sidebar />

  <!-- Tapping outside the drawer closes it (below lg only) -->
  @if (layoutService.navOpen()) {
    <div
      class="fixed inset-x-0 bottom-0 top-16 z-30 bg-black/40 backdrop-blur-[1px] lg:hidden"
      aria-hidden="true"
      (click)="layoutService.closeNav()"
    ></div>
  }

  <!-- Page -->
  <div class="flex min-h-screen flex-col pt-16 lg:ps-64">
    <main class="mx-auto w-full min-w-0 max-w-[1600px] flex-1 p-3 sm:p-5 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
