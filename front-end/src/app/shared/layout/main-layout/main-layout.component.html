<div dir="rtl" lang="ar" class="min-h-screen bg-surface-bg text-text-primary">
  <!-- Header -->
  <header class="fixed inset-x-0 top-0 z-50 h-16 border-b border-primary-hover bg-primary text-on-primary shadow-md">
    <div class="flex h-full items-center justify-between px-4 lg:px-8">
      <!-- Identity -->
      <div class="flex min-w-0 items-center gap-2 sm:gap-3.5">
        <button
          type="button"
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-on-primary/90 transition hover:bg-on-primary/10 active:scale-95 lg:hidden"
          aria-controls="app-sidebar"
          [attr.aria-expanded]="layoutService.navOpen()"
          [attr.aria-label]="layoutService.navOpen() ? 'إغلاق القائمة' : 'فتح القائمة'"
          (click)="layoutService.toggleNav()"
        >
          <span class="material-symbols-outlined text-[26px]" aria-hidden="true">{{ layoutService.navOpen() ? 'close' : 'menu' }}</span>
        </button>
        <div class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full bg-on-primary/10 ring-2 ring-accent/70 sm:flex">
          <span class="material-symbols-outlined text-[24px] text-accent" aria-hidden="true">school</span>
        </div>
        <div class="flex min-w-0 flex-col">
          <div class="flex items-center gap-2">
            <span class="truncate text-sm font-black leading-none sm:text-base lg:text-lg">جامعة آل البيت</span>
            <span class="hidden rounded-full border border-accent/40 bg-accent/20 px-2 py-0.5 text-[11px] font-bold text-accent sm:inline-block">
              صيانة الحرم
            </span>
          </div>
          <span class="mt-0.5 hidden text-xs font-semibold text-accent sm:block">بوابة البلاغات الطلابية والخدمية</span>
        </div>
      </div>

      <!-- Tools + profile -->
      <div class="flex items-center gap-3 sm:gap-6">
        <div class="flex items-center gap-1 sm:gap-2">
          <button
            type="button"
            class="relative flex h-11 w-11 items-center justify-center rounded-xl text-on-primary/80 transition hover:bg-on-primary/10 hover:text-on-primary"
            [attr.aria-label]="'الإشعارات (' + notificationCount() + ' جديدة)'"
          >
            <span class="material-symbols-outlined text-[22px]" aria-hidden="true">notifications</span>
            @if (notificationCount() > 0) {
              <span class="absolute start-1.5 top-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-status-error text-[10px] font-bold text-text-inverse shadow">
                {{ notificationCount() }}
              </span>
            }
          </button>

          <button
            type="button"
            class="flex h-11 w-11 items-center justify-center rounded-xl text-on-primary/80 transition hover:bg-on-primary/10 hover:text-on-primary"
            (click)="themeService.toggle()"
            [attr.aria-label]="themeService.theme() === 'dark' ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الداكن'"
          >
            <span class="material-symbols-outlined text-[22px]" aria-hidden="true">
              {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
            </span>
          </button>
        </div>

        <div class="hidden h-7 w-px bg-on-primary/20 sm:block"></div>

        <div class="flex items-center gap-3 rounded-xl border border-on-primary/10 bg-on-primary/5 p-1.5 sm:px-3 sm:py-1.5">
          @if (user(); as u) {
            <div class="hidden flex-col sm:flex">
              <div class="flex items-center gap-1.5">
                <span class="font-mono text-xs font-bold">{{ u.studentId }}</span>
                <span class="material-symbols-outlined text-[15px] text-status-success" title="حساب جامعي موثّق">verified</span>
              </div>
              <span class="text-[11px] text-on-primary/70" dir="ltr">{{ u.email }}</span>
            </div>
          }
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-on-primary/10 ring-2 ring-accent">
            <span class="material-symbols-outlined text-[22px]" aria-hidden="true">person</span>
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Side navigation -->
  <app-sidebar />

  <!-- Tapping outside the drawer closes it (below lg only) -->
  @if (layoutService.navOpen()) {
    <div
      class="fixed inset-x-0 bottom-0 top-16 z-30 bg-black/40 backdrop-blur-[1px] lg:hidden"
      aria-hidden="true"
      (click)="layoutService.closeNav()"
    ></div>
  }

  <!-- Page -->
  <div class="flex min-h-screen flex-col pt-16 lg:ps-64">
    <main class="mx-auto w-full min-w-0 max-w-[1600px] flex-1 p-3 sm:p-5 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
