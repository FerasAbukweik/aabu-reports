<!-- Side navigation (start side = right in RTL) -->
<!-- Below lg it is a drawer: hidden off the start edge (and removed from the tab order) until opened -->
<aside
  id="app-sidebar"
  class="fixed bottom-0 start-0 top-16 z-40 flex w-72 max-w-[85vw] flex-col justify-between overflow-y-auto overscroll-contain border-e border-border-subtle bg-surface-card py-5 shadow-sm transition-[transform,visibility] duration-300 ease-out motion-reduce:transition-none lg:w-64 lg:max-w-none lg:translate-x-0 lg:visible"
  [class]="layout.navOpen() ? 'translate-x-0 visible' : 'translate-x-full invisible'"
>
  <div class="flex flex-col gap-5 px-3">
    <div class="px-3 text-[11px] font-extrabold tracking-wider text-text-secondary">
      {{ title }}
    </div>

    <nav [attr.aria-label]="ariaLabel" class="flex flex-col gap-1.5">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          #rla="routerLinkActive"
          ariaCurrentWhenActive="page"
          (click)="layout.closeNav()"
          class="relative flex min-h-12 items-center gap-3 rounded-xl px-3.5 py-3 transition"
          [class]="
            rla.isActive
              ? 'bg-primary font-bold text-on-primary shadow-sm'
              : 'font-semibold text-text-primary hover:bg-surface-card-subtle'
          "
        >
          @if (rla.isActive) {
            <span class="absolute inset-y-2 start-0 w-1.5 rounded-e-full bg-accent"></span>
          }
          <span
            class="material-symbols-outlined text-[22px]"
            [class]="rla.isActive ? 'text-accent' : 'text-text-secondary'"
            aria-hidden="true"
            >{{ item.icon }}</span
          >
          <span class="text-sm">{{ item.label }}</span>

          @if (item.inProgress) {
            <span
              class="ms-auto rounded-full bg-status-warning-bg px-2 py-0.5 font-mono text-[11px] font-bold text-status-warning-text text-center"
            >
              {{ item.inProgress }} قيد التنفيذ
            </span>
          }
        </a>
      }
    </nav>
  </div>

  <!-- footer: stays hardcoded -->
  <div class="flex flex-col gap-3 border-t border-border-subtle px-3 pt-4">
    <div class="rounded-xl border border-status-in-progress/30 bg-status-in-progress-bg p-3">
      <div class="mb-1 flex items-center gap-2 text-xs font-bold text-status-in-progress-text">
        <span class="material-symbols-outlined text-[18px] text-accent" aria-hidden="true"
          >headset_mic</span
        >
        <span>دعم الصيانة السريع</span>
      </div>
      <p class="text-[11px] leading-snug text-status-in-progress-text">
        خط طوارئ الصيانة داخل الحرم الجامعي:
        <span class="font-mono font-bold">3333</span>
      </p>
    </div>

    <button
      type="button"
      class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-start font-bold text-status-error transition hover:bg-status-error-bg"
      (click)="layout.closeNav(); logout()"
    >
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">logout</span>
      <span class="text-sm">تسجيل خروج</span>
    </button>
  </div>
</aside>
