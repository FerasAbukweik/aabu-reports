<div class="card p-4 relative overflow-hidden">
  <div class="absolute top-0 start-0 w-1.5 h-full bg-accent"></div>

  <div class="flex items-center justify-between mb-2">
    <span class="badge badge-accent text-[11px]">
      <span class="material-symbols-outlined text-[13px]" aria-hidden="true">sms</span>
      رمز التحقق الفوري (OTP)
    </span>
    <span class="text-xs font-bold text-accent-hover" aria-live="off" dir="ltr">
      {{ countdownLabel() }}
    </span>
  </div>

  <h3 class="text-sm font-bold text-primary">التحقق من الهاتف المعتمد</h3>
  <p class="text-[11px] text-text-secondary mt-1">
    تم تجهيز رسالة التوثيق للرقم المسجل:
    <span class="font-bold text-primary" dir="ltr">{{ phone() }}</span>
  </p>

  <!-- digit inputs -->
  <div
    class="grid gap-2 my-3"
    dir="ltr"
    [style.grid-template-columns]="'repeat(' + length() + ', minmax(0, 1fr))'"
  >
    @for (i of indexes(); track i) {
      <input
        #otpInput
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="1"
        class="otp-box h-10 text-base"
        placeholder="•"
        [attr.aria-label]="'الخانة ' + (i + 1) + ' من رمز التحقق'"
        [value]="digits()[i]"
        (input)="onInput(i, $event)"
        (keydown)="onKeydown(i, $event)"
        (paste)="onPaste($event)"
      />
    }
  </div>

  <div class="flex items-center justify-between text-[11px] text-text-secondary">
    <span>لم يصلك الرمز بعد؟</span>
    <button type="button" class="link-accent" (click)="onResend()">إعادة إرسال الرمز</button>
  </div>
</div>
