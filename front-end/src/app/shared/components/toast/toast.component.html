<div
  class="pointer-events-none fixed inset-x-4 bottom-6 z-100 flex flex-col items-stretch gap-2 sm:inset-x-auto sm:end-6 sm:w-96"
  (mouseenter)="toastService.pause()"
  (mouseleave)="toastService.resume()"
  (focusin)="toastService.pause()"
  (focusout)="toastService.resume()"
>
  @if (toastService.extraCount() > 0) {
    <span class="tone-normal absolute -top-3 right-2 z-10" aria-live="polite">
      <span
        class="tone-dot flex h-6 min-w-6 items-center justify-center rounded-md px-1 text-[11px] font-black text-text-inverse shadow-lg"
        [attr.aria-label]="toastService.extraCount() + ' إشعارات إضافية'"
      >
        {{ toastService.extraCount() }}
      </span>
    </span>
  }
  @for (t of toastService.visibleToasts(); track t.id) {
    <div
      class="toast-item tone-chip pointer-events-auto flex items-start gap-3 rounded-xl border px-4 py-3.5 shadow-2xl"
      [class]="statusTone[t.status]"
      [attr.role]="role(t.status)"
    >
      <span
        class="tone-dot flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-text-inverse"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">{{ t.icon }}</span>
      </span>

      <div class="min-w-0 flex-1">
        <h4 class="text-xs font-black">{{ t.title }}</h4>
        @if (t.message) {
          <p class="mt-0.5 text-[11px] font-medium opacity-80">{{ t.message }}</p>
        }
      </div>

      <button
        type="button"
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md opacity-70 transition-opacity hover:opacity-100 focus-visible:opacity-100 focus-visible:outline-2 focus-visible:outline-border-focus"
        aria-label="إغلاق"
        (click)="toastService.dismiss(t.id)"
      >
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">close</span>
      </button>
    </div>
  }
</div>
