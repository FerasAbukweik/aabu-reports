<dialog
  #dialog
  dir="rtl"
  lang="ar"
  class="m-auto w-full rounded-2xl bg-transparent p-0 text-text-primary backdrop:bg-text-primary/60 backdrop:backdrop-blur-sm"
  [class]="maxWidth()"
  [attr.aria-labelledby]="titleId"
  (click)="onBackdropClick($event)"
  (close)="onNativeClose()"
>
  <div class="overflow-hidden rounded-2xl border border-border-subtle bg-surface-card shadow-2xl">
    <!-- Header -->
    <div
      class="flex items-center justify-between border-b-2 border-accent bg-primary px-6 py-4 text-on-primary"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-accent/60 bg-on-primary/10 text-accent"
        >
          <span class="material-symbols-outlined text-[24px]" aria-hidden="true">{{ icon() }}</span>
        </div>
        <div>
          <h3 [id]="titleId" class="text-lg font-black">{{ title() }}</h3>
          @if (subtitle(); as text) {
            <p class="text-xs text-on-primary/70">{{ text }}</p>
          }
        </div>
      </div>
      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-on-primary/20 bg-on-primary/10 transition hover:bg-on-primary/20"
        aria-label="إغلاق النافذة"
        (click)="closed.emit()"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">close</span>
      </button>
    </div>

    <div class="p-6">
      <ng-content />
    </div>
  </div>
</dialog>
